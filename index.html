<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Where To Go · 想去哪儿</title>
<meta name="description" content="One tap from your saved places to a plain-language transit answer.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111411" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<!-- No service worker, by decision (PROJECT.md §7): this app is useless offline, so it does not pretend otherwise. -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Where To Go">
<link rel="stylesheet" href="style.css?v=1.0">
</head>
<body>

<section class="gate" id="gate" aria-live="polite">
  <div class="gate-box">
    <p class="gate-title" id="gateTitle">想去哪儿?</p>
    <p class="gate-msg" id="gateMsg">正在确认位置…</p>
    <button class="go" id="gateAllow" type="button" hidden>允许定位</button>
    <button class="back" id="gateSkip" type="button" hidden>先看看</button>
  </div>
</section>

<main class="app" id="app">

  <header class="bar">
    <h1 class="ask" id="ask">想去哪儿?</h1>
    <button class="gear" id="settingsBtn" type="button" aria-label="Settings">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>

  <ul class="tiles" id="tiles"></ul>

  <!-- Answer for one place. Two actions only: go, or go back. -->
  <section class="sheet" id="sheet" hidden aria-labelledby="sheetTitle">
    <div class="panel">
      <div class="sheet-head">
        <h2 class="sheet-title" id="sheetTitle"></h2>
        <button class="sheet-edit" id="editPlace" type="button" aria-label="Edit">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4l10-10a2.5 2.5 0 0 0-3.5-3.5L4.5 16.5 4 20z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <p class="dest" id="destAddr" hidden></p>
      <p class="summary" id="summary" role="status" aria-live="polite"></p>
      <p class="stamp" id="stamp" hidden></p>
      <a class="go" id="goBtn" href="#" rel="noopener">Open in Maps</a>
      <button class="retry" id="retryLoc" type="button" hidden>Use my location</button>
      <button class="back" id="closeSheet" type="button">Back</button>
    </div>
  </section>

  <!-- Settings: the two things that are not about a place. Addresses are edited on the tile itself. -->
  <section class="sheet" id="manage" hidden aria-labelledby="manageTitle">
    <div class="panel">
      <h2 class="sheet-title" id="manageTitle">Settings</h2>
      <p class="warn" id="storageWarn" hidden></p>
      <p class="seg-label" id="langLabel">Language</p>
      <div class="seg" id="langRow" role="group" aria-labelledby="langLabel"></div>
      <p class="seg-label" id="themeLabel">Appearance</p>
      <div class="seg" id="themeRow" role="group" aria-labelledby="themeLabel"></div>
      <button type="button" class="row" id="installBtn">Add to home screen</button>
      <button type="button" class="ver" id="verBtn"><span><span id="verLabel">Version</span> <span id="appVersion">1.0</span></span> · <span id="verMsg">Check for updates</span></button>
      <button class="go" id="closeManage" type="button">Done</button>
    </div>
  </section>

  <!-- Add to the home screen. Not an offline story — this app has no offline mode — the point is that
       a person taps one icon on their own phone instead of finding the browser first. Same shape as
       Violin Toolkit's install sheet: pick the phone, then three numbered steps with the button they
       are looking for drawn beside the step. -->
  <section class="sheet" id="install" hidden aria-labelledby="installTitle">
    <div class="panel">
      <h2 class="sheet-title" id="installTitle">Add to home screen</h2>
      <p class="sr-only" id="devLabel">Phone</p>
      <div class="seg" id="devRow" role="group" aria-labelledby="devLabel"></div>
      <ol class="steps" id="stepsIos"></ol>
      <ol class="steps" id="stepsAndroid"></ol>
      <p class="steps-note" id="installNote">Once it is on the home screen, one tap opens it.</p>
      <button class="go" id="installDone" type="button">Done</button>
    </div>
  </section>

  <!-- The icon chooser: opened from the pencil beside the symbol, closes when one is picked. -->
  <section class="sheet picker" id="icons" hidden aria-labelledby="iconLabel">
    <div class="panel">
      <p class="sr-only" id="iconLabel">Icon</p>
      <div class="icons" id="placeIcons" role="group" aria-labelledby="iconLabel"></div>
    </div>
  </section>

  <!-- One place, opened from its pencil. Has the delete, and the delete asks twice. -->
  <section class="sheet" id="place" hidden aria-labelledby="placeTitle">
    <div class="panel">
      <h2 class="sheet-title" id="placeTitle"></h2>
      <button class="sheet-close" id="placeClose" type="button" aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <label class="sr-only" id="nameLabel" for="placeName">Name</label>
      <!-- The pencil says "this is editable" without saying it in words. Decorative: the field is
           already a field, and its label is the sr-only one above. -->
      <div class="namerow">
        <input id="placeName" class="title-input" type="text" autocomplete="off">
        <span class="name-edit" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M4 20h4l10-10a2.5 2.5 0 0 0-3.5-3.5L4.5 16.5 4 20z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
      </div>

      <!-- The symbol is the control: tapping it opens the chooser (Trix). -->
      <div class="glyphrow">
        <button class="glyph" id="glyphView" type="button" aria-label="Icon"></button>
      </div>

      <label class="sr-only" id="addrLabel" for="placeAddr">Address</label>
      <!-- Autocomplete, not a text field: what gets stored is one of the geocoder's own answers. -->
      <div class="combo">
        <input id="placeAddr" type="text" autocomplete="off" spellcheck="false"
               role="combobox" aria-expanded="false" aria-controls="addrList" aria-autocomplete="list">
        <ul class="addr-list" id="addrList" role="listbox" aria-label="Addresses" hidden></ul>
      </div>
      <p class="warn" id="placeNote" hidden></p>
      <p class="warn" id="placeWarn" hidden></p>
      <button class="del" id="placeDel" type="button">Delete</button>
      <button class="go" id="placeDone" type="button">Done</button>
    </div>
  </section>

</main>

<script type="module" src="app.js?v=1.0"></script>
</body>
</html>
