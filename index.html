<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Where To Go · 想去哪儿</title>
<meta name="description" content="One tap from your saved places to a plain-language transit answer.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111411" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<!-- No service worker, by decision (PROJECT.md §7): this app is useless offline, so it does not pretend otherwise. -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Where To Go">
<link rel="stylesheet" href="style.css?v=0.1">
</head>
<body>

<main class="app" id="app">

  <header class="bar">
    <h1 class="ask" id="ask">想去哪儿?</h1>
    <button class="gear" id="settingsBtn" type="button" aria-label="Settings">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M12 8.4a3.6 3.6 0 1 0 0 7.2 3.6 3.6 0 0 0 0-7.2zm9.2 5.1-.1-1.5 1.4-2.1a.6.6 0 0 0 .1-.6l-1.9-3.3a.6.6 0 0 0-.6-.2l-2.4.8a8.9 8.9 0 0 0-1.3-.7l-.5-2.6a.6.6 0 0 0-.6-.5h-3.8a.6.6 0 0 0-.6.5l-.5 2.6c-.5.2-.9.4-1.3.7l-2.4-.8a.6.6 0 0 0-.6.2L2.4 9.3a.6.6 0 0 0 .1.6l1.4 2.1a8.9 8.9 0 0 0 0 1.5l-1.4 2.1a.6.6 0 0 0-.1.6l1.9 3.3a.6.6 0 0 0 .6.2l2.4-.8c.4.3.8.5 1.3.7l.5 2.6a.6.6 0 0 0 .6.5h3.8a.6.6 0 0 0 .6-.5l.5-2.6c.5-.2.9-.4 1.3-.7l2.4.8a.6.6 0 0 0 .6-.2l1.9-3.3a.6.6 0 0 0-.1-.6l-1.4-2.1z"/>
      </svg>
    </button>
  </header>

  <ul class="tiles" id="tiles"></ul>

  <!-- Answer for one place. Two actions only: go, or go back. -->
  <section class="sheet" id="sheet" hidden aria-labelledby="sheetTitle">
    <div class="panel">
      <h2 class="sheet-title" id="sheetTitle"></h2>
      <p class="summary" id="summary" role="status" aria-live="polite"></p>
      <p class="stamp" id="stamp" hidden></p>
      <a class="go" id="goBtn" href="#" rel="noopener">Open in Maps</a>
      <button class="back" id="closeSheet" type="button">Back</button>
    </div>
  </section>

  <!-- Helper's screen, not the traveller's. -->
  <section class="sheet" id="manage" hidden aria-labelledby="manageTitle">
    <div class="panel">
      <h2 class="sheet-title" id="manageTitle">Places</h2>
      <div class="lang" id="langRow" role="group" aria-label="Language"></div>
      <ul class="places" id="places"></ul>
      <button class="add" id="addBtn" type="button">Add a place</button>
      <p class="ver">Version <span id="appVersion">0.1</span></p>
      <button class="back" id="closeManage" type="button">Done</button>
    </div>
  </section>

</main>

<script type="module" src="app.js?v=0.1"></script>
</body>
</html>
