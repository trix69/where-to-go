<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Where To Go · 想去哪儿</title>
<meta name="description" content="One tap from your saved places to a plain-language transit answer.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111411" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<!-- No service worker, by decision (PROJECT.md §7): this app is useless offline, so it does not pretend otherwise. -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Where To Go">
<link rel="stylesheet" href="style.css?v=0.1">
</head>
<body>

<main class="app" id="app">

  <header class="bar">
    <h1 class="ask" id="ask">想去哪儿?</h1>
    <button class="gear" id="settingsBtn" type="button" aria-label="Settings">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>

  <ul class="tiles" id="tiles"></ul>

  <!-- Answer for one place. Two actions only: go, or go back. -->
  <section class="sheet" id="sheet" hidden aria-labelledby="sheetTitle">
    <div class="panel">
      <h2 class="sheet-title" id="sheetTitle"></h2>
      <p class="summary" id="summary" role="status" aria-live="polite"></p>
      <p class="stamp" id="stamp" hidden></p>
      <div class="origins" id="originChoices" hidden>
        <p class="origins-ask" id="originAsk">Where are you starting from?</p>
        <div class="origins-list" id="originList"></div>
      </div>
      <a class="go" id="goBtn" href="#" rel="noopener">Open in Maps</a>
      <button class="retry" id="retryLoc" type="button" hidden>Use my location</button>
      <button class="back" id="closeSheet" type="button">Back</button>
    </div>
  </section>

  <!-- Helper's screen, not the traveller's. -->
  <section class="sheet" id="manage" hidden aria-labelledby="manageTitle">
    <div class="panel">
      <h2 class="sheet-title" id="manageTitle">Places</h2>
      <div class="lang" id="langRow" role="group" aria-label="Language"></div>
      <ul class="places" id="places"></ul>
      <button class="add" id="addBtn" type="button">Add a place</button>
      <button type="button" class="ver" id="verBtn"><span><span id="verLabel">Version</span> <span id="appVersion">0.1</span></span> · <span id="verMsg">Check for updates</span></button>
      <button class="back" id="closeManage" type="button">Done</button>
    </div>
  </section>

</main>

<script type="module" src="app.js?v=0.1"></script>
</body>
</html>
